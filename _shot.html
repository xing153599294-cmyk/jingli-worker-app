<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>shot probe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="phone">
    <div id="app" class="app"></div>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal-mask" hidden>
    <div class="modal-box" id="modal-box"></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/grab.js"></script>
  <script src="js/pages/build.js"></script>
  <script src="js/pages/report.js"></script>
  <script src="js/pages/rectify.js"></script>
  <script src="js/pages/study.js"></script>
  <script src="js/pages/mall.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var r = q.get('r');
      var c = q.get('c');
      function clickAct() {
        var btn = document.querySelector('[data-act="' + c + '"]');
        if (btn) btn.click();
      }
      if (r) {
        if (c) {
          /* 等 hashchange 渲染完再点 */
          window.addEventListener('hashchange', function once() {
            window.removeEventListener('hashchange', once);
            setTimeout(clickAct, 50);
          });
        }
        location.hash = r;
      } else if (c) {
        setTimeout(clickAct, 50);
      }
    })();
  </script>
</body>
</html>
